autoInstallPeers: true
catalogMode: prefer
cleanupUnusedCatalogs: true
enablePrePostScripts: true
ignoreWorkspaceRootCheck: true

minimumReleaseAgeExclude:
    - "@isentinel/eslint-config@6.0.0-beta.11"

publicHoistPattern:
    - "*@rbxts*"
    - "*@lisachandra*"
    - "*@flamework*"
    - "*@rbxts-js*"
    - "*@nrbx*"
    - "*eslint*"

saveExact: true
shellEmulator: true
trustPolicy: no-downgrade

trustPolicyExclude:
    - chokidar@4.0.3
    - eslint-config-prettier@9.1.2
    - semver@5.7.2
    - tinyexec@1.2.2

trustPolicyIgnoreAfter: 10080

packages:
    - "packages/@internal/*"
    - "packages/tsc7"

overrides:
    "@rbxts/crate>@rbxts/sift": 0.0.11
    eslint-plugin-arrow-return-style-x>@typescript-eslint/utils: 8.65.0

patchedDependencies:
    "@isentinel/roblox-ts@4.0.11": patches/@isentinel__roblox-ts@4.0.11.patch
    "@rbxts-js/emittery@3.16.0-ts.1": patches/@rbxts-js__emittery@3.16.0-ts.1.patch
    "@rbxts-js/expect@3.16.0-ts.1": patches/@rbxts-js__expect@3.16.0-ts.1.patch
    "@rbxts-js/jest-mock@3.16.0-ts.1": patches/@rbxts-js__jest-mock@3.16.0-ts.1.patch
    "@rbxts-js/jest-runner@3.16.0-ts.1": patches/@rbxts-js__jest-runner@3.16.0-ts.1.patch
    "@rbxts/centurion": patches/@rbxts__centurion.patch
    "@rbxts/compiler-types": patches/@rbxts__compiler-types@3.0.0-types.0.patch
    "@rbxts/jest-globals@3.16.0-ts.1": patches/@rbxts__jest-globals@3.16.0-ts.1.patch
    "@rbxts/log": patches/@rbxts__log.patch
    "@rbxts/luau-polyfill": patches/@rbxts__luau-polyfill.patch
    "@rbxts/matter": patches/@rbxts__matter.patch
    "@rbxts/object-cache": patches/@rbxts__object-cache.patch
    "@rbxts/serio": patches/@rbxts__serio.patch
    "@rbxts/sift": patches/@rbxts__sift.patch
    commit-and-tag-version: patches/commit-and-tag-version.patch
    rbxts-transformer-flamework: patches/rbxts-transformer-flamework.patch

catalog:
    "@bedrock-rbx/core": 0.1.0-beta.22
    "@commitlint/cli": 20.5.3
    "@commitlint/config-conventional": 20.5.3
    "@commitlint/prompt-cli": 20.5.3
    "@commitlint/types": 20.5.0
    "@flamework/core": 1.3.2
    "@isentinel/dict-rbxts": 1.0.14
    "@isentinel/dict-roblox": 1.0.7
    "@isentinel/dict-wally": 1.0.13
    "@isentinel/eslint-config": 6.0.0-beta.11
    "@isentinel/roblox-ts": 4.0.11
    "@isentinel/tsconfig": 1.2.0
    "@lisachandra/constant": 0.3.0
    "@lisachandra/core": 0.1.0
    "@lisachandra/matter": 0.1.0
    "@lisachandra/test": 0.1.0
    "@lisachandra/types": 0.1.0
    "@rbxts/compiler-types": latest
    "@rbxts/jest": 3.16.0-ts.1
    "@rbxts/jest-globals": 3.16.0-ts.1
    "@rbxts/luau-polyfill": 1.1.3
    "@rbxts/matter": github:matter-ecs/matter-types
    "@rbxts/serio": 1.2.5
    "@rbxts/services": latest
    "@rbxts/tether": 1.4.21
    "@rbxts/types": latest
    "@types/node": 24.10.4
    "@typescript-eslint/eslint-plugin": 8.65.0
    "@typescript/native-preview": 7.0.0-dev.20260707.2
    barrelsby: 2.8.1
    commit-and-tag-version: 12.7.1
    husky: 9.1.7
    io-serve: 1.1.2
    jiti: 2.6.1
    oxfmt: 0.60.0
    oxlint: 1.73.0
    oxlint-tsgolint: 0.24.0
    rbxts-transformer-flamework: 1.3.2
    shx: 0.4.0
    tsx: 4.21.0
    type-fest: 5.8.0
    typescript: 6.0.3

allowBuilds:
    "@lisachandra/constant": true
    "@lisachandra/core": true
    "@lisachandra/matter": true
    "@lisachandra/platform": true
    "@lisachandra/test": true
    "@lisachandra/types": true
    "@lisachandra/ui": true
    esbuild: true
    oxc-resolver: true
    unrs-resolver: true

configDependencies:
    "@pnpm/plugin-trusted-deps": 0.2.2+sha512-+ZupiXKJhW2fbSilfyRp+wrAY54MKg+c0JWSFGdeb/y9bUoYN5u4XLOZ0Txk7O2bBa6NMhWrX5mwmsHP3/nm9Q==

onlyBuiltDependenciesFile: node_modules/.pnpm-config/@pnpm/plugin-trusted-deps/allow.json
