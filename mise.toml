[env]
_.file = { path = ".env", redact = true }

[tools]
"github:jacktabscode/asphalt" = "2.0.2"
"github:jacktabscode/drillbit" = "0.2.0"
"github:luau-lang/lute" = "1.0.0"
"github:lune-org/lune" = "0.11.1"
"github:rojo-rbx/rojo" = "7.7.0"
"github:rojo-rbx/run-in-roblox" = "0.3.0"
bun = "1.4.4"
gh = "2.103.3"
jq = "1.8.2"
node = "26.13.0"
pnpm = "12.16.1"

# sloptor is the compiler (build + typecheck). The fork is required: this repo
# mounts two `node_modules` trees (shared under ReplicatedStorage, server under
# ServerScriptService) and needs `rbxts.runtimeRoots` to tell the compiler where
# each lives — a key upstream v3.0.0-beta.4 does not have.
#
# The `-fork.N` suffix keeps the fork's release from colliding with upstream's
# own v3.0.0-beta.4 tag, which the fork inherits.
[tools."github:lisachandra/sloptor"]
version = "3.0.0-beta.4-fork.1"

[tools."github:lisachandra/sloptor".platforms]
windows-x64 = { asset_pattern = "*windows-amd64.zip" }
linux-x64 = { asset_pattern = "*linux-amd64.tar.gz" }
linux-arm64 = { asset_pattern = "*linux-arm64.tar.gz" }
darwin-arm64 = { asset_pattern = "*darwin-arm64.tar.gz" }

[tools."github:lisachandra/darklua"]
version = "0.19.0"

# Both platforms ship `.zip` — the fork has no `.tar.gz` assets, so a
# `.tar.gz` pattern fails `mise install` on Linux with "No matching asset".
[tools."github:lisachandra/darklua".platforms]
windows-x64 = { asset_pattern = "*windows-x86_64*.zip" }
linux-x64 = { asset_pattern = "*linux-x86_64*.zip" }

# ree (roblox-engine-emulator) builds from a release fork: tags carry the
# upstream commit the binaries were cut from; scripts/emulator/reflection.json
# must be re-copied from the same commit on every bump.
[tools."github:lisachandra/roblox-engine-emulator"]
version = "0.1.0-771754c6"

[tools."github:lisachandra/roblox-engine-emulator".platforms]
windows-x64 = { asset_pattern = "*windows-x86_64*.zip" }
linux-x64 = { asset_pattern = "*linux-x86_64*.tar.gz" }
linux-arm64 = { asset_pattern = "*linux-arm64*.tar.gz" }
darwin-arm64 = { asset_pattern = "*darwin-arm64*.tar.gz" }

[tasks.bedrock]
description = "Run the Bedrock CLI from pnpm"
run = "pnpm exec bedrock"
raw = true
