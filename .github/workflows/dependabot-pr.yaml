name: Dependabot PR Check

on:
  pull_request:
    branches: [main]

jobs:
  check_dependabot:
    if: ${{ github.actor == 'dependabot[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Create Artifact with PR Info
        run: |
          echo "pr_number=${{ github.event.pull_request.number }}" > pr_info.txt
          echo "pr_sha=${{ github.event.pull_request.head.sha }}" >> pr_info.txt
          echo "pr_branch=${{ github.event.pull_request.head.ref }}" >> pr_info.txt

      - name: Upload PR Info
        uses: actions/upload-artifact@v4
        with:
          name: pr-info
          path: pr_info.txt
