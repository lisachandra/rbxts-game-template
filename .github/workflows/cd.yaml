name: Continuous Deployment

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

env:
  CI: true
  HUSKY: 0

concurrency:
  group: roblox-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy production to Roblox
    runs-on: ubuntu-latest
    environment:
      name: production

    steps:
      - name: Bootstrap local actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false

      - id: checkout
        name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      - name: Build and postprocess
        run: pnpm build && pnpm darklua
        shell: bash

      - name: Build production place
        run: pnpm bedrock:build
        env:
          ROBLOX_GLOBAL_ASSETS_PLACE_ID: ${{ secrets.ROBLOX_GLOBAL_ASSETS_PLACE_ID }}

      - name: Show Bedrock diff
        run: mise run bedrock -- diff --env production
        env:
          BEDROCK_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          BEDROCK_GITHUB_TOKEN: ${{ secrets.BEDROCK_GITHUB_TOKEN }}

      - name: Deploy to Roblox
        run: mise run bedrock -- deploy --env production
        env:
          BEDROCK_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          BEDROCK_GITHUB_TOKEN: ${{ secrets.BEDROCK_GITHUB_TOKEN }}
