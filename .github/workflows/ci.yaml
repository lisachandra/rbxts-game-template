name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: read

env:
  CI: true
  HUSKY: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    environment:
      name: ci
    steps:
      - name: Bootstrap local actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - id: checkout
        name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ref: ${{ steps.checkout.outputs.ref }}
          pnpm-config-auth: ${{ secrets.PNPM_CONFIG__AUTH }}

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

  test:
    needs: [lint]
    if: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY != '' }}
    runs-on: ubuntu-latest
    environment:
      name: ci
    steps:
      - name: Bootstrap local actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - id: checkout
        name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ref: ${{ steps.checkout.outputs.ref }}
          pnpm-config-auth: ${{ secrets.PNPM_CONFIG__AUTH }}

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}
