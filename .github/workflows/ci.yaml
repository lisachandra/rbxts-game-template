name: Continuous Integration

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  actions: read
  contents: read
  packages: read

env:
  CI: true
  HUSKY: 0

jobs:
  lint:
    runs-on: ubuntu-latest
    environment:
      name: ci
    steps:
      - name: Bootstrap local actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - id: checkout
        name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ref: ${{ steps.checkout.outputs.ref }}
          pnpm-config-auth: ${{ secrets.PNPM_CONFIG__AUTH }}

      - name: Build
        run: pnpm build

      - name: Lint
        run: pnpm lint

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    environment:
      name: ci
    concurrency:
      group: luau-execution
      cancel-in-progress: false
    env:
      HAS_ROBLOX_OPEN_CLOUD: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY != '' }}
    outputs:
      coverage: ${{ steps.extract_coverage.outputs.coverage }}
      test_results: ${{ steps.extract_test_results.outputs.test_results }}
    steps:
      - name: Bootstrap local actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - id: checkout
        name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ref: ${{ steps.checkout.outputs.ref }}
          pnpm-config-auth: ${{ secrets.PNPM_CONFIG__AUTH }}

      - name: Build
        run: pnpm build

      - name: Test
        if: ${{ env.HAS_ROBLOX_OPEN_CLOUD == 'true' }}
        run: pnpm test --coverageReporters json-summary --coverageReporters json | tee test_results.txt
        env:
          ROBLOX_OPEN_CLOUD_API_KEY: ${{ secrets.ROBLOX_OPEN_CLOUD_API_KEY }}
          ROBLOX_PLACE_ID: ${{ secrets.ROBLOX_PLACE_ID }}
          ROBLOX_UNIVERSE_ID: ${{ secrets.ROBLOX_UNIVERSE_ID }}

      - id: extract_coverage
        name: Extract Coverage
        run: |
          if [ -f coverage/coverage-summary.json ]; then
            COVERAGE=$(node -e "const fs=require('fs');const summary=JSON.parse(fs.readFileSync('coverage/coverage-summary.json','utf8'));process.stdout.write(String(summary.total.lines.pct));")
          else
            COVERAGE=0
          fi
          echo "coverage=$COVERAGE" >> "$GITHUB_OUTPUT"
        shell: bash

      - id: extract_test_results
        name: Extract Test Results
        run: |
          TEST_RESULTS=$(grep -oP 'Tests:\s+\K.*' test_results.txt | tail -n 1 || true)
          if [ -z "$TEST_RESULTS" ]; then
            TEST_RESULTS="unavailable"
          fi
          echo "test_results=$TEST_RESULTS" >> "$GITHUB_OUTPUT"

  badge:
    needs: [test]
    if: ${{ needs.test.outputs.test_results != '' && needs.test.outputs.test_results != 'unavailable' }}
    runs-on: ubuntu-latest
    environment:
      name: ci
    env:
      HAS_GIST: ${{ secrets.GIST_SECRET != '' && vars.CI_BADGE_GIST_ID != '' }}
    steps:
      - name: Bootstrap local actions
        uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github/actions
          sparse-checkout-cone-mode: false
          fetch-depth: 0

      - id: checkout
        name: Checkout
        uses: ./.github/actions/checkout

      - name: Setup
        uses: ./.github/actions/setup
        with:
          ref: ${{ steps.checkout.outputs.ref }}
          pnpm-config-auth: ${{ secrets.PNPM_CONFIG__AUTH }}

      - id: badge_info
        name: Get Badge Information
        run: |
          echo "coverage=${{ needs.test.outputs.coverage }}" >> "$GITHUB_OUTPUT"
          echo "test_results=${{ needs.test.outputs.test_results }}" >> "$GITHUB_OUTPUT"
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if echo "${{ needs.test.outputs.test_results }}" | grep -q "failed"; then
            echo "test_color=hsl(0, 100%, 40%)" >> "$GITHUB_OUTPUT"
          else
            echo "test_color=hsl(120, 100%, 40%)" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Test Coverage Badge
        if: ${{ env.HAS_GIST == 'true' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          filename: test-coverage-badge.svg
          gistID: ${{ vars.CI_BADGE_GIST_ID }}
          label: test coverage
          maxColorRange: 100
          message: ${{ steps.badge_info.outputs.coverage }}%
          minColorRange: 0
          valColorRange: ${{ steps.badge_info.outputs.coverage }}

      - name: Create Test Results Badge
        if: ${{ env.HAS_GIST == 'true' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          color: ${{ steps.badge_info.outputs.test_color }}
          filename: test-results-badge.svg
          gistID: ${{ vars.CI_BADGE_GIST_ID }}
          label: tests
          message: ${{ steps.badge_info.outputs.test_results }}

      - name: Create Version Badge
        if: ${{ env.HAS_GIST == 'true' }}
        uses: schneegans/dynamic-badges-action@v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          color: blue
          filename: version-badge.svg
          gistID: ${{ vars.CI_BADGE_GIST_ID }}
          label: version
          message: ${{ steps.badge_info.outputs.version }}
