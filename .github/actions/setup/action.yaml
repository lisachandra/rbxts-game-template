name: Setup
description: Setup mise, cache pnpm store, and install dependencies

inputs:
  pnpm-config-auth:
    default: ""
    description: pnpm registry auth JSON
    required: true
  ref:
    description: Git ref or SHA to use for asset checkout
    required: true

runs:
  using: composite
  steps:
    - name: Setup mise
      uses: jdx/mise-action@v4
      with:
        install: true

    - name: Get pnpm store directory
      run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      shell: bash

    - name: Cache pnpm store
      uses: actions/cache@v5
      with:
        key: pnpm-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml') }}
        path: ${{ env.STORE_PATH }}
        restore-keys: pnpm-${{ runner.os }}-

    - name: Install dependencies
      run: PNPM_CONFIG_VERIFY_DEPS_BEFORE_RUN=false pnpm setup
      env:
        PNPM_CONFIG__AUTH: ${{ inputs.pnpm-config-auth }}
      shell: bash
